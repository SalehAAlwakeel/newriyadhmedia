<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" role="img" aria-labelledby="nrm-logo-title nrm-logo-desc">
  <title id="nrm-logo-title">New Riyadh Media</title>
  <desc id="nrm-logo-desc">Bordered square monogram with the letters N, R and M overlapping in serif type, above the words New Riyadh Media and the tagline Marketing Agency.</desc>

  <defs>
    <style>
      .nrm-logo text {
        font-family: 'Cormorant Garamond', 'Cormorant', 'Didot', 'Times New Roman', serif;
        fill: currentColor;
      }
    </style>
  </defs>

  <g class="nrm-logo" fill="currentColor">

    <!-- Square frame -->
    <rect x="100" y="80" width="400" height="400"
          fill="none" stroke="currentColor" stroke-width="3"
          vector-effect="non-scaling-stroke"/>

    <!-- NRM monogram (overlapped via negative letter-spacing) -->
    <text x="300" y="380"
          text-anchor="middle"
          font-size="300"
          font-weight="500"
          letter-spacing="-58">NRM</text>

    <!-- Brand wordmark -->
    <text x="300" y="580"
          text-anchor="middle"
          font-size="56"
          font-weight="400"
          letter-spacing="9">NEW RIYADH MEDIA</text>

    <!-- Tagline with flanking rules -->
    <line x1="130" y1="650" x2="210" y2="650" stroke="currentColor" stroke-width="2"/>
    <text x="300" y="658"
          text-anchor="middle"
          font-size="22"
          font-weight="400"
          letter-spacing="9">MARKETING AGENCY</text>
    <line x1="390" y1="650" x2="470" y2="650" stroke="currentColor" stroke-width="2"/>

  </g>
</svg>
